name: CI

# path-filtered 增量 CI（ADR-013 / 07 §6）。bootstrap 期：
#  - adr-gate / layout 为阻塞门（BUG-006 / REQ-006 护栏）
#  - 模块级构建按变更路径触发（REQ-005 落地完整依赖图增量；此处为骨架）
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # —— 治理门（始终运行，阻塞合并）——
  governance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ADR 评审闭环 gate（BUG-006 / adr-standard §4.2）
        run: python tools/adr_gate.py
      - name: monorepo 布局纪律 gate（ADR-013 / REQ-006）
        run: python tools/check_layout.py
      - name: agent registry gate（agent-standard / agent-registry.yml）
        run: python tools/check_agents.py
      - name: secret 扫描 gate（BUG-003 ①：厂商 key 不入代码/配置）
        run: python tools/check_secrets.py
      - name: Home Intelligence planning integrity gate (REQ-012)
        run: |
          python tools/check_home_intelligence_planning.py
          python -m unittest discover -s tests -p test_home_intelligence_planning.py
      - name: Home Intelligence 公共数据脱敏 gate
        run: python tools/check_home_intelligence_public_data.py
      - name: 迁移 RLS 扫描 gate（TC-002-05 / BUG-002：新表须 RLS、禁 SECURITY DEFINER）
        run: python tools/check_rls.py

  # —— 变更路径检测（REQ-005 增量 CI 骨架）——
  changes:
    runs-on: ubuntu-latest
    outputs:
      goal: ${{ steps.filter.outputs.goal }}
      libs: ${{ steps.filter.outputs.libs }}
      home_intelligence: ${{ steps.filter.outputs.home_intelligence }}
      home_requirements: ${{ steps.filter.outputs.home_requirements }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            goal:
              - 'agents/goal/**'
            libs:
              - 'libs/**'
              - '.github/workflows/ci.yml'
            home_intelligence:
              - 'apps/home-intelligence-web/**'
            home_requirements:
              - 'docs/product/home-intelligence/requirements.xlsx'
              - 'docs/product/home-intelligence/roadmap.yaml'
              - 'tools/check_home_intelligence_requirements.py'
            mcp:
              - 'toolsets/mcp/**'
              - 'agents/goal/app/auth/oidc.py'
              - 'agents/goal/app/main.py'
              - 'agents/goal/app/config.py'
              - 'agents/goal/pyproject.toml'
              - 'agents/goal/tests/conftest.py'
              - 'agents/goal/tests/integration/test_legacy_direct_disabled.py'
              - '.github/workflows/ci.yml'

  # REQ-013/014/015 runtime contracts: required tests execute with zero skips.
  state-schema-tc:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    needs: changes
    if: ${{ needs.changes.outputs.libs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install shared contract package and validation tools
        run: python -m pip install -e 'libs/state-schema[test]'
      - name: Lint shared contract package and tests
        run: ruff check libs/state-schema/src libs/state-schema/tests
      - name: Type-check shared contracts
        run: mypy --config-file libs/state-schema/pyproject.toml libs/state-schema/src
      - name: Run inventory, binding and State TCs without skips
        run: >-
          python -m pytest -c libs/state-schema/pytest.ini libs/state-schema/tests
          --require-inventory-runtime --require-binding-runtime --require-state-runtime -q
          --junitxml=/tmp/state-schema-results.xml
      - name: Validate public fixtures and legacy requirements
        run: |
          python tools/check_home_intelligence_public_data.py
          python tools/check_home_intelligence_requirements.py
      - name: Build and smoke-test the installed wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/state-schema-wheel libs/state-schema
          python -m venv /tmp/state-schema-wheel-env
          /tmp/state-schema-wheel-env/bin/python -m pip install --no-deps /tmp/state-schema-wheel/*.whl
          cd /tmp
          /tmp/state-schema-wheel-env/bin/python -I "$GITHUB_WORKSPACE/libs/state-schema/tests/wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-schema-tc-results-${{ matrix.python-version }}
          path: /tmp/state-schema-results.xml

  # —— goal-agent 模块构建（按路径触发；libs 改动触发下游回归）——
  goal-agent:
    needs: changes
    if: ${{ needs.changes.outputs.goal == 'true' || needs.changes.outputs.libs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff lint（agents/goal）
        # 迁移期非阻塞但失败可见：continue-on-error 不阻塞合并，但 ruff 失败仍标记该步骤失败
        # （不要 `|| true`，否则退出码被吞 → 静默绿，BUG-026）。REQ-005 落地后去 continue-on-error 转阻塞。
        continue-on-error: true
        run: |
          pipx install ruff || pip install ruff
          ruff check agents/goal
      - name: 占位 —— 单元测试随 REQ-003 切片改造接入（MariaDB→PG 后）
        run: echo "goal-agent 测试在 REQ-003 迁移完成后纳入阻塞门（见 08 §7 / REQ-005）"

  # —— MCP manifest + gateway trust boundary（REQ-003 WP-4，阻塞）——
  mcp-toolsets:
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Goal MCP and gateway test dependencies
        run: >-
          python -m pip install
          -e toolsets/mcp/goal-mcp
          -e 'toolsets/mcp/gateway[test]'
          -e 'agents/goal[dev]'
          ruff
      - name: Lint MCP toolsets
        run: ruff check toolsets/mcp/goal-mcp toolsets/mcp/gateway
      - name: Test manifest and gateway boundary
        run: pytest toolsets/mcp/goal-mcp/tests toolsets/mcp/gateway/tests -q
      - name: Test GoalAgent legacy routes remain disabled
        run: pytest agents/goal/tests/integration/test_legacy_direct_disabled.py -q

  # —— Home Intelligence 前端原型（阻塞 lint/build）——
  home-intelligence-web:
    needs: changes
    if: ${{ needs.changes.outputs.home_intelligence == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/home-intelligence-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/home-intelligence-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # —— 需求基线结构、层级、枚举、依赖与导入视图（阻塞）——
  home-intelligence-requirements:
    needs: changes
    if: ${{ needs.changes.outputs.home_requirements == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_home_intelligence_requirements.py

  # —— REQ-002 集成（真实 PG16 + Redis service）：RLS 真表隔离/审计 append-only + Redis ——
  req002-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "psycopg[binary]" redis
      - name: RLS（模式+真表迁移）+ 审计 append-only + Redis（TC-002-04/05/06）
        env:
          AIFAMILY_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          AIFAMILY_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/integration -v
