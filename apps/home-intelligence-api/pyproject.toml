[project]
name = "ai-family-home-intelligence-api"
version = "0.1.0"
description = "Authenticated canonical household query HTTP boundary"
requires-python = ">=3.12"
dependencies = [
    "ai-family-home-device-fabric>=0.1.0,<0.2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28.1,<0.29", "ruff", "mypy", "build", "hatchling"]
serve = ["uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_intelligence_api"]

[tool.mypy]
python_version = "3.12"
strict = true
