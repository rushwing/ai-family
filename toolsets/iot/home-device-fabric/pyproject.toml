[project]
name = "ai-family-home-device-fabric"
version = "0.1.0"
description = "Typed provider boundary and deterministic offline mock"
requires-python = ">=3.12"
dependencies = ["ai-family-state-schema>=0.1.0,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff", "mypy", "build", "hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_device_fabric"]

[tool.mypy]
python_version = "3.12"
strict = true
