# toolsets/mcp/gateway —— MCP 网关（信任边界）
# 模块化单体仓的独立可构建模块（ADR-013 / ADR-010）；uv workspace 接入随 REQ-005。
[project]
name = "mcp-gateway"
version = "0.1.0"
description = "ai-family MCP 网关：工具侧 JWT、两段式 confirm、tenant scope、审计（REQ-003 WP-4）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",
    "goal-mcp",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
