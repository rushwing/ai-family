[project]
name = "ai-family-state-schema"
version = "0.1.0"
description = "Provider-neutral inventory, offline target resolution and provider binding contracts"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/state_schema"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/state_schema"]
